<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客戶管理儀表板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 基本樣式與先前相同 */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --border: #252535;
    --accent: #7c6af7; --accent-bright: #a394ff; 
    --text: #e8e8f0; --muted: #8b8b9d; --success: #7cf7b8; --warn: #f7d47c;
    --hover-bg: rgba(124,106,247,0.05);
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; font-weight: 300; }

  nav {
    position: sticky; top: 0; z-index: 100; height: 60px;
    background: rgba(10,10,15,0.9); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight:700; color: #fff; letter-spacing: 1px; }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .btn-sm { padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; transition: all .2s; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent-bright); }
  .btn-accent { background: linear-gradient(135deg, var(--accent), #9b8dff); color: #fff; }
  
  main { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
  
  .company-brand { text-align: center; margin-bottom: 40px; }
  .company-brand img { height: 70px; object-fit: cover; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid var(--border); }
  .company-brand h2 { font-size: 24px; margin-top: 16px; font-weight: 500; }

  .collapsible-account { background: rgba(18,18,26,0.6); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 40px; overflow: hidden; transition: all 0.3s ease; }
  .account-header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.02); }
  .account-header:hover { background: rgba(255,255,255,0.05); }
  .account-header h3 { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .arrow { transition: transform 0.3s; font-size: 12px; color: var(--muted); }
  .arrow.open { transform: rotate(180deg); }
  .account-body { display: none; padding: 24px; border-top: 1px solid var(--border); }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
  .info-item { display: flex; flex-direction: column; gap: 6px; }
  .info-label { font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .info-val { font-size: 15px; font-weight: 500; color: var(--accent-bright); }

  .table-wrap { background: rgba(18,18,26,0.8); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: rgba(30,30,46,0.8); }
  th { padding: 16px 20px; text-align: left; font-size: 12px; color: var(--muted); }
  td { padding: 18px 20px; font-size: 14px; border-top: 1px solid rgba(255,255,255,0.05); vertical-align: middle; transition: background 0.2s; }
  tr { cursor: pointer; }
  tbody tr:hover td { background: var(--hover-bg); }
  
  .category-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; background: rgba(100,200,255,0.1); border: 1px solid rgba(100,200,255,0.2); color: #64c8ff; }
  .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
  .status-yes { background: rgba(124,247,184,0.1); border: 1px solid rgba(124,247,184,0.3); color: var(--success); }
  .status-no { background: rgba(247,212,124,0.1); border: 1px solid rgba(247,212,124,0.3); color: var(--warn); }
  
  /* 詳情 Modal - 寬度調整至 500px 以便舒適地呈現雙排圖片 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-overlay.open { display: flex; }
  .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 500px; max-width: 95%; max-height: 90vh; overflow-y: auto; }
  .modal-content h3 { font-size: 20px; margin-bottom: 20px; color: var(--accent-bright); }
  .det-row { margin-bottom: 12px; font-size: 14px; line-height: 1.6;}
  .det-label { color: var(--muted); display: inline-block; width: 80px; }
  .close-btn { width: 100%; margin-top: 24px; }

  /* 上傳資訊與圖片區塊樣式 */
  .upload-info-box { margin-top: 16px; background: rgba(124,247,184,0.03); border: 1px dashed rgba(124,247,184,0.25); padding: 16px; border-radius: 10px; }
  .upload-info-title { font-size: 13px; color: var(--success); font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; gap: 4px; }
  
  /* 圖片網格排版 */
  .image-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .image-item { background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); padding: 6px; border-radius: 8px; text-align: center; }
  .image-item span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .image-item img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: transform 0.2s; }
  .image-item img:hover { transform: scale(1.03); }
</style>
</head>
<body>
<nav>
  <div class="nav-logo"><div class="logo-dot"></div>CRM SYSTEM</div>
  <div class="nav-right">
    {% if user.role == 'admin' %}
    <button class="btn-sm btn-accent" onclick="location.href='/admin'">管理員後台</button>
    {% endif %}
    <button class="btn-sm btn-outline" id="logoutBtn">登出</button>
  </div>
</nav>

<main>
  <div class="company-brand">
    <img src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?auto=format&fit=crop&w=400&q=80" alt="Company Logo">
    <h2>客戶與服務管理中心</h2>
  </div>

  <div class="collapsible-account">
    <div class="account-header" onclick="toggleAccount()">
      <h3>👤 您的帳號資訊</h3><span class="arrow" id="accArrow">▼</span>
    </div>
    <div class="account-body" id="accBody">
      <div class="info-grid">
        <div class="info-item"><span class="info-label">使用者名稱</span><span class="info-val" id="dispName">—</span></div>
        <div class="info-item"><span class="info-label">電子郵件</span><span class="info-val" id="dispEmail">—</span></div>
        <div class="info-item"><span class="info-label">權限角色</span><span class="info-val" id="dispRole" style="color:var(--success)">—</span></div>
      </div>
    </div>
  </div>

  <h3 style="margin-bottom:16px; font-weight:500;">✨ 服務項目與商戶列表</h3>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>服務類別</th>
          <th>商戶 / 專案名稱</th>
          <th>上傳狀態</th>
          <th>建檔日期</th>
          <th style="text-align:right">操作</th>
        </tr>
      </thead>
      <tbody id="servicesTbody">
        <tr><td colspan="5" style="text-align:center; padding:30px; color:var(--muted)">載入中...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="detailsModal">
  <div class="modal-content">
    <h3 id="detName">專案名稱</h3>
    <div class="det-row"><span class="det-label">商戶名稱</span><span id="detMerchant"></span></div>
    <div class="det-row"><span class="det-label">服務類別</span><span id="detCat"></span></div>
    <div class="det-row"><span class="det-label">資料狀態</span><span id="detStatus"></span></div>
    <div class="det-row"><span class="det-label">建立日期</span><span id="detDate"></span></div>
    <div class="det-row" style="margin-top:16px;"><span class="det-label">服務說明</span><div id="detDesc" style="color:var(--muted); margin-top:6px; background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;"></div></div>
    
    <div id="uploadInfoContainer"></div>

    <button class="btn-sm btn-outline close-btn" onclick="document.getElementById('detailsModal').classList.remove('open')">關閉</button>
  </div>
</div>

<script>
  let servicesData = [];

  function toggleAccount() {
    const body = document.getElementById('accBody');
    const arrow = document.getElementById('accArrow');
    const isHidden = window.getComputedStyle(body).display === 'none';
    body.style.display = isHidden ? 'block' : 'none';
    arrow.classList.toggle('open', isHidden);
  }

  fetch('/api/me').then(r=>r.json()).then(u => {
    document.getElementById('dispName').textContent = u.full_name || u.username;
    document.getElementById('dispEmail').textContent = u.email;
    document.getElementById('dispRole').textContent = u.role === 'admin' ? '系統管理員' : '一般使用者';
  });

  async function loadServices() {
    const res = await fetch('/api/services');
    servicesData = await res.json();
    const tbody = document.getElementById('servicesTbody');
    if(servicesData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--muted)">目前無可用服務</td></tr>';
      return;
    }
    
    tbody.innerHTML = servicesData.map(s => `
      <tr onclick="showDetails(${s.id})">
        <td><span class="category-badge">${s.category}</span></td>
        <td>
          <div style="font-weight:500; color:var(--text)">${s.name}</div>
          <div style="font-size:12px; color:var(--muted); margin-top:4px;">${s.merchant_name || '未設定商戶'}</div>
        </td>
        <td>
          ${s.has_uploaded 
            ? '<span class="status-badge status-yes">✓ 已上傳</span>' 
            : '<span class="status-badge status-no">⚠ 未上傳</span>'}
        </td>
        <td style="font-family:'Space Mono'; color:var(--muted)">${s.published_date}</td>
        <td style="text-align:right">
          <button class="btn-sm btn-outline" style="border-color:var(--accent); color:var(--accent-bright)" onclick="confirmExecution(event, ${s.id}, '${s.name}')">執行</button>
        </td>
      </tr>
    `).join('');
  }

  async function showDetails(id) {
    const s = servicesData.find(x => x.id === id);
    if(!s) return;
    
    document.getElementById('detName').textContent = s.name;
    document.getElementById('detMerchant').textContent = s.merchant_name || '無';
    document.getElementById('detCat').textContent = s.category;
    document.getElementById('detStatus').innerHTML = s.has_uploaded ? '<span style="color:var(--success)">已上傳</span>' : '<span style="color:var(--warn)">未上傳</span>';
    document.getElementById('detDate').textContent = s.published_date;
    document.getElementById('detDesc').textContent = s.description || '沒有提供詳細說明。';
    
    const infoContainer = document.getElementById('uploadInfoContainer');
    infoContainer.innerHTML = ''; 

    // 如果項目已上傳，撈取資料並加載四張圖片
    if (s.has_uploaded) {
      try {
        infoContainer.innerHTML = '<div style="color:var(--muted); font-size:13px; margin-top:16px;">正在讀取上傳審查資料...</div>';
        const simRes = await fetch('/api/simulation-data');
        const simData = await simRes.json();
        
        // 渲染文字審查資料 + 圖片網格 (利用後端對 /local_data 的 StaticFiles 掛載)
        infoContainer.innerHTML = `
          <div class="upload-info-box">
            <div class="upload-info-title">📁 已確認上傳之商戶審查資訊</div>
            <div class="det-row"><span class="det-label" style="width:70px;">企業名稱:</span><span style="color:var(--text)">${simData.company}</span></div>
            <div class="det-row"><span class="det-label" style="width:70px;">負責人:</span><span style="color:var(--text)">${simData.name}</span></div>
            <div class="det-row"><span class="det-label" style="width:70px;">聯絡電話:</span><span style="color:var(--text)">${simData.phone}</span></div>
            <div class="det-row"><span class="det-label" style="width:70px;">登記地址:</span><span style="color:var(--text)">${simData.address}</span></div>
            
            <div class="upload-info-title" style="margin-top: 18px; margin-bottom: 6px;">🖼️ 附加影像證明文件</div>
            <div class="image-grid">
              <div class="image-item">
                <span>店家照片 (store.jpg)</span>
                <img src="/local_data/store.jpg" alt="店家照片" onclick="window.open(this.src)">
              </div>
              <div class="image-item">
                <span>身分證正面 (id_front.jpg)</span>
                <img src="/local_data/id_front.jpg" alt="身分證正面" onclick="window.open(this.src)">
              </div>
              <div class="image-item">
                <span>身分證反面 (id_back.jpg)</span>
                <img src="/local_data/id_back.jpg" alt="身分證反面" onclick="window.open(this.src)">
              </div>
              <div class="image-item">
                <span>銀行帳戶 (bank.jpg)</span>
                <img src="/local_data/bank.jpg" alt="銀行帳戶" onclick="window.open(this.src)">
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        infoContainer.innerHTML = '<div style="color:var(--warn); font-size:13px; margin-top:16px;">無法載入上傳審查資料</div>';
      }
    }

    document.getElementById('detailsModal').classList.add('open');
  }

  function confirmExecution(event, id, name) {
    event.stopPropagation(); 
    if(confirm(`準備執行商戶專案：【${name}】\n系統將轉至模擬執行畫面，是否繼續？`)) {
      window.location.href = `/execution/${id}`;
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  loadServices();
</script>
</body>
</html>
