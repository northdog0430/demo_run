<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — 帳號管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #7c6af7;
    --accent-bright: #a394ff;
    --accent-glow: rgba(124,106,247,0.25);
    --text: #e8e8f0;
    --muted: #6b6b85;
    --error: #f77c7c;
    --success: #7cf7b8;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  /* ── 背景動畫網格 ── */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridPan 20s linear infinite;
  }
  @keyframes gridPan { to { background-position: 48px 48px; } }

  .bg-orb {
    position: fixed; border-radius: 50%; filter: blur(120px); z-index: 0; pointer-events: none;
  }
  .orb1 { width: 500px; height: 500px; background: rgba(124,106,247,0.12); top: -150px; right: -100px; }
  .orb2 { width: 400px; height: 400px; background: rgba(100,200,255,0.06); bottom: -100px; left: -100px; }

  /* ── 主容器 ── */
  .wrapper {
    position: relative; z-index: 1;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  .card {
    width: 420px;
    background: rgba(18,18,26,0.85);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px 40px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 0 1px rgba(124,106,247,0.1), 0 32px 80px rgba(0,0,0,0.5);
    animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Logo ── */
  .logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .logo-text { font-family: 'Space Mono', monospace; font-size: 14px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  h1 { font-size: 26px; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.5px; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 36px; }

  /* ── 表單 ── */
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }

  .input-wrap { position: relative; }
  .input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px 14px 12px 42px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  input::placeholder { color: var(--muted); }

  /* 顯示密碼按鈕 */
  .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--muted);
    padding: 4px; display: flex; align-items: center; justify-content: center;
    transition: color .2s;
  }
  .eye-btn:hover { color: var(--text); }

  /* ── 按鈕 ── */
  .btn-primary {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), #9b8dff);
    border: none; border-radius: 10px;
    color: #fff; font-size: 15px; font-weight: 500;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; letter-spacing: 0.5px;
    position: relative; overflow: hidden;
    transition: transform .15s, box-shadow .2s;
    box-shadow: 0 4px 20px var(--accent-glow);
    margin-top: 8px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 30px var(--accent-glow); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary.loading { pointer-events: none; opacity: .7; }
  .btn-primary .spinner {
    display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-primary.loading .btn-text { display: none; }
  .btn-primary.loading .spinner { display: block; }

  /* ── 訊息 ── */
  .msg {
    display: none; padding: 12px 14px; border-radius: 8px;
    font-size: 13px; margin-bottom: 16px; align-items: center; gap: 8px;
  }
  .msg.error { background: rgba(247,124,124,0.1); border: 1px solid rgba(247,124,124,0.3); color: var(--error); display: flex; }
  .msg.success { background: rgba(124,247,184,0.1); border: 1px solid rgba(124,247,184,0.3); color: var(--success); display: flex; }

  .footer-note { text-align: center; margin-top: 24px; font-size: 12px; color: var(--muted); }
  .footer-note span { color: var(--accent-bright); font-family: 'Space Mono', monospace; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="wrapper">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">Auth System</div>
    </div>

    <h1>歡迎回來</h1>
    <p class="subtitle">請輸入您的帳號與密碼以繼續</p>

    <div class="msg" id="msg"></div>

    <div class="field">
      <label>帳號</label>
      <div class="input-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" placeholder="輸入帳號" autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label>密碼</label>
      <div class="input-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" placeholder="輸入密碼" autocomplete="current-password">
        <button class="eye-btn" id="eyeBtn" type="button">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="eyeIcon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-primary" id="loginBtn">
      <span class="btn-text">登入</span>
      <div class="spinner"></div>
    </button>

    <p class="footer-note">預設管理員：<span>admin</span> / <span>admin123</span></p>
  </div>
</div>

<script>
  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const loginBtn   = document.getElementById('loginBtn');
  const msgEl      = document.getElementById('msg');
  const eyeBtn     = document.getElementById('eyeBtn');

  // 顯示密碼切換
  eyeBtn.addEventListener('click', () => {
    const show = passwordEl.type === 'password';
    passwordEl.type = show ? 'text' : 'password';
    eyeBtn.innerHTML = show
      ? `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  });

  function showMsg(text, type) {
    msgEl.className = 'msg ' + type;
    msgEl.textContent = text;
  }

  async function doLogin() {
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) { showMsg('請填入帳號與密碼', 'error'); return; }

    loginBtn.classList.add('loading');
    msgEl.className = 'msg';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (res.ok) {
        showMsg('登入成功，跳轉中…', 'success');
        setTimeout(() => { window.location.href = '/dashboard'; }, 600);
      } else {
        showMsg(data.detail || '登入失敗', 'error');
        loginBtn.classList.remove('loading');
      }
    } catch {
      showMsg('連線失敗，請稍後再試', 'error');
      loginBtn.classList.remove('loading');
    }
  }

  loginBtn.addEventListener('click', doLogin);
  [usernameEl, passwordEl].forEach(el => el.addEventListener('keydown', e => e.key === 'Enter' && doLogin()));
</script>
</body>
</html>
